name: CI

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  lint-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: "Set up Python"
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          activate-environment: true
          enable-cache: false
      - name: Install project dependencies
        run: |
          uv sync --active --group lint --no-install-project --upgrade

      - name: Run linter
        run: |
          ruff check --no-fix ./src

      - name: Run type checker
        run: |
          mypy ./src
  test-package:
    name: >-
      Test package
    needs:
      - lint-package
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - 3.14
          - 3.13
          - 3.12

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: "Set up Python"
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          activate-environment: true
          enable-cache: false

      - name: Run tests
        run: |
          uvx tox

  build-package:
    name: >-
      Build package
    needs:
      - test-package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: "Set up Python"
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          activate-environment: false
          enable-cache: false

      - name: Install project dependencies
        run: |
          uv sync --no-default-groups --no-install-project

      - name: Build and store the package
        run: uv build

      # Publish with uv publish:
      # - https://docs.astral.sh/uv/guides/publish/
      # - https://github.com/astral-sh/trusted-publishing-examples/blob/main/.github/workflows/release.yml
      # Check that basic features work and we didn't miss to include crucial files
      - name: Smoke test (wheel)
        run: uv check --preview-features check-command

      - name: Publish
        run: uv publish
